; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; There are three sketches in src/, each with its own setup()/loop().
; PlatformIO compiles every .cpp in src/ by default, so without the
; build_src_filter lines below they collide at link time with "multiple
; definition of setup()". Each env therefore picks exactly one sketch:
;
;   pio run -e uno      -t upload     ; PID controller (the product)
;   pio run -e mpc      -t upload     ; host-driven MPC front end
;   pio run -e test_pid -t upload     ; automated PID test protocol
;
; `pio run` with no -e builds all three, which is a useful compile check.

[env]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
; Log every serial session to logs/device-monitor-*.log, for EVERY env.
; This lived under [env:test_pid] alone, which meant attaching with
; PlatformIO's toolbar button (it uses the default env, `uno`) silently
; produced no log file — a 35 minute test run with its data only in
; terminal scrollback. Shared here so no attach method can lose the log.
; log2file writes the raw stream; `time` only prefixes the terminal
; display, so the file stays clean CSV.
monitor_filters = log2file, time
lib_deps =
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    red-scorp/LiquidCrystal_AIP31068@^1.0.5
    red-scorp/SoftSPIB@^1.1.2

[env:uno]
build_src_filter = +<main.cpp>

; [env:mpc]
; build_src_filter = +<main_mcp.cpp>

; [env:test_pid]
; build_src_filter = +<test_harness_pid.cpp>

; ; Automated MPC protocol. Control is computed by host/MPC_HOST_TEST.m in
; ; MATLAB, which holds the COM port — so do NOT attach pio device monitor
; ; to this one. The MATLAB script writes the log instead.
